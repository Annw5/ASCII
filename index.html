<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ASCII</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
    body {
      display: grid; height: 100dvh;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      grid-template-areas: "stage";
    }
    #stage { grid-area: stage; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas { display: block; flex: none; }

    /* ---------- сенсорное управление ---------- */
    .pad { display: none; }
    body.touch {
      --b: min(15vw, 15dvh);                 /* размер кнопки */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; touch-action: none;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "stage stage" "padl padr";
    }
    body.touch .pad {
      display: grid; gap: 4px; justify-self: center; align-self: center;
      grid-template-columns: repeat(3, var(--b));
      grid-template-rows: repeat(3, var(--b));
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    }
    #padl { grid-area: padl; }
    #padr { grid-area: padr; }

    .btn {
      margin: 0; padding: 0; border-radius: 50%;
      border: 2px solid #3a4a5a; background: rgba(40, 60, 80, .55);
      color: #9fe8ff; font: 700 calc(var(--b) * .42) monospace;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    .btn.on { background: rgba(77, 225, 255, .5); color: #fff; }
    #menuBtn { color: #ffe14d; font-size: calc(var(--b) * .34); }

    /* горизонтальный режим: блоки по бокам от игры */
    @media (orientation: landscape) {
      body.touch {
        --b: min(22dvh, 9.5vw);
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-rows: minmax(0, 1fr);
        grid-template-areas: "padl stage padr";
      }
      body.touch .pad { padding: 0 8px; }
      body.touch #padl { padding-left: calc(8px + env(safe-area-inset-left)); }
      body.touch #padr { padding-right: calc(8px + env(safe-area-inset-right)); }
    }
    /* панель (I) на сенсорных: игра на весь экран, кнопки по нижним углам */
body.touch.panel {
  --b: min(14vw, 13dvh);
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  grid-template-areas: "all";
}
body.touch.panel #stage, body.touch.panel #padl, body.touch.panel #padr { grid-area: all; }
body.touch.panel .pad {
  position: relative; z-index: 1; align-self: end;
  padding: 8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
}
body.touch.panel #padl { justify-self: start; }
body.touch.panel #padr { justify-self: end; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>

  <!-- левый блок: диагональные шаги + кнопка меню в центре -->
  <div class="pad" id="padl">
    <button type="button" class="btn" data-key="q" style="grid-area:1/1">Q</button>
    <button type="button" class="btn" data-key="e" style="grid-area:1/3">E</button>
    <button type="button" class="btn" id="menuBtn" data-key="menu" style="grid-area:2/2">☰</button>
    <button type="button" class="btn" data-key="z" style="grid-area:3/1">Z</button>
    <button type="button" class="btn" data-key="c" style="grid-area:3/3">C</button>
    <button type="button" class="btn" data-key="i" style="grid-area:2/1">i</button>
  </div>

  <!-- правый блок: W A S D крестом -->
  <div class="pad" id="padr">
    <button type="button" class="btn" data-key="w" style="grid-area:1/2">W ↑</button>
    <button type="button" class="btn" data-key="a" style="grid-area:2/1">← A</button>
    <button type="button" class="btn" data-key="d" style="grid-area:2/3">D →</button>
    <button type="button" class="btn" data-key="s" style="grid-area:3/2">↓ S</button>
  </div>

  <script type="module" src="client-web/main.js"></script>
</body>
</html>
